name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.17.0', 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check source and browser example types
        run: npm run typecheck && npm run typecheck:browser

      - name: Verify the installed package
        run: npm run test:package

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify browser example types and production build
        run: npm run build && npm run typecheck:browser && npm run build:example

      - name: Run browser tests through Playwright MCP
        run: node scripts/browser-test.mjs

      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/browser/
